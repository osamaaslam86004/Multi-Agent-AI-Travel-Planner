name: CI Pipeline
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
jobs:
  lint-and-test:
    name: Linting, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv ruff mypy pytest pytest-asyncio email-validator
          uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
          uv pip install --system --no-deps -r /tmp/requirements.txt
      - name: Run Ruff Linter
        run: |
          ruff check .
      - name: Run Mypy Type Check
        run: |
          mypy services/ --ignore-missing-imports || true
      - name: Run Entrypoint Smoke Test & Pytest
        run: |
          PYTHONPATH=. pytest tests/ -v
  docker-build-and-scan:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build BFF Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/Dockerfile.gateway
          push: false
          tags: tb-bff-gateway:latest
          load: true
      - name: Build Auth Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/Dockerfile.auth
          push: false
          tags: tb-auth-service:latest
          load: true
      - name: Build Worker Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/Dockerfile.worker
          push: false
          tags: tb-worker-service:latest
          load: true
      - name: Run Trivy Vulnerability Scan (Gateway)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tb-bff-gateway:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"