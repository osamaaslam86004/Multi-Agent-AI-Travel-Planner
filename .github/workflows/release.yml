name: Release Workflow
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  build-and-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package Release Asset
        run: |
          tar -czvf travelbrain-${{ github.ref_name }}.tar.gz \
            app.py \
            src/ \
            frontend/ \
            Dockerfile \
            docker-compose.yml \
            pyproject.toml \
            README.md \
            CHANGELOG.md \
            .env.example \
            .python-version \
            requirements.txt
      - name: Create Release Notes & Tag Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          files: |
            travelbrain-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
