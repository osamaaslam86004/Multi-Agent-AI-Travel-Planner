name: travelbrain-microservices

networks:
  travelbrain-mesh:
    driver: bridge

volumes:
  redis-data:
  postgres-data:

services:
  bff-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile.gateway
    container_name: tb-bff-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - AUTH_SERVICE_JWKS_URL=http://auth-service:8001/.well-known/jwks.json
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - travelbrain-mesh

  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile.auth
    container_name: tb-auth-service
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
      - JWT_ISSUER=https://auth.travelbrain.ai
      - JWT_AUDIENCE=https://api.travelbrain.ai
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8001/health/live",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - travelbrain-mesh

  flight-service:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
    container_name: tb-flight-service
    command: ["python", "-m", "services.flight_service.worker"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
      - AVIATIONSTACK_API_KEY=${AVIATIONSTACK_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - travelbrain-mesh

  hotel-service:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
    container_name: tb-hotel-service
    command: ["python", "-m", "services.hotel_service.worker"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - travelbrain-mesh

  weather-service:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
    container_name: tb-weather-service
    command: ["python", "-m", "services.weather_service.worker"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - travelbrain-mesh

  synthesis-service:
    build:
      context: .
      dockerfile: services/Dockerfile.worker
    container_name: tb-synthesis-service
    command: ["python", "-m", "services.synthesis_service.worker"]
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://localhost:11434/v1}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - travelbrain-mesh

  redis:
    image: redis:7-alpine
    container_name: tb-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-travelbrain_redis_pass_2026}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-travelbrain_redis_pass_2026}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - travelbrain-mesh

  postgres:
    image: postgres:16-alpine
    container_name: tb-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelbrain_pg_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-travelbrain}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbrain -d travelbrain"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - travelbrain-mesh
