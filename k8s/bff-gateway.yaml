apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-gateway
  namespace: travelbrain
  labels:
    app: bff-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bff-gateway
  template:
    metadata:
      labels:
        app: bff-gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: ghcr.io/travelbrain/bff-gateway:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: travelbrain-config
          env:
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "travelbrain"
            - name: POSTGRES_USER
              value: "travelbrain"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: POSTGRES_PASSWORD
            - name: SCIM_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: SCIM_TOKEN_SECRET
            - name: JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: JWT_PRIVATE_KEY_PEM
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: JWT_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bff-gateway
  namespace: travelbrain
spec:
  type: ClusterIP
  selector:
    app: bff-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8000