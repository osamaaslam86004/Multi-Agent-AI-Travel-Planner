
# Domain Workers Deployments (Flight, Hotel, Weather, Synthesis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: travelbrain
  labels:
    app: flight-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      labels:
        app: flight-service
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: flight-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: flight-worker
          image: ghcr.io/travelbrain/domain-worker:v2.0.0@sha256:9c00d04c4032a767686cf7de988c01ea96gh159g45c67g6c6d3456789cdefabb
          command: ["python", "-m", "services.flight_service.worker"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: travelbrain-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: REDIS_PASSWORD
            - name: AVIATIONSTACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: AVIATIONSTACK_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
