apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-service
  namespace: travelbrain
  labels:
    app: flight-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-service
  template:
    metadata:
      labels:
        app: flight-service
    spec:
      containers:
        - name: worker
          image: ghcr.io/travelbrain/worker-service:latest
          command: ["python", "-m", "services.flight_service.worker"]
          envFrom:
            - configMapRef:
                name: travelbrain-config
            - secretRef:
                name: travelbrain-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
