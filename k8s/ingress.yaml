
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelbrain-ingress
  namespace: travelbrain
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-rps: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.travelbrain.ai
      secretName: travelbrain-tls-cert
  rules:
    - host: api.travelbrain.ai
      http:
        paths:
          - path: /api/v1/auth/saml/acs
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /scim/v2
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff-gateway
                port:
                  number: 80

