
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-service
  namespace: travelbrain
  labels:
    app: postgres-service
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres-service
  template:
    metadata:
      labels:
        app: postgres-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:d81a967f6edec0b8e05085e6a9f4c396c0d64cf771d9f4851179781b0ff42c75
          env:
            - name: POSTGRES_USER
              value: "travelbrain"
            - name: POSTGRES_DB
              value: "travelbrain"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelbrain-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U travelbrain -d travelbrain
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U travelbrain -d travelbrain
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: travelbrain
spec:
  type: ClusterIP
  selector:
    app: postgres-service
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

