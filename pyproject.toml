[project]
name = "multi-agent-travel-agent-planner"
version = "0.1.0"
description = "Enterprise Distributed Multi-Agent Travel Planning System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "airportsdata>=20260803",
    "cryptography>=42.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.3",
    "langchain-mcp-adapters>=0.1.0",
    "openweather-mcp==0.1.0",
    "nest-asyncio>=1.6.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.1.18",
    "pycountry>=24.6.1",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.3",
    "requests>=2.31.0",
    "tavily>=0.3.3",
    "uvicorn>=0.29.0",
]
[project.optional-dependencies]
local-llm = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
]
google = [
    "google-genai>=0.1.0",
    "langchain-google-genai>=1.0.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
]
all = [
    "multi-agent-travel-agent-planner[local-llm,google,test]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"